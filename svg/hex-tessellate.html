<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>single-hex tessellation</title>
<style>
  body { margin: 0; background: #050810; display: flex; flex-direction: column; align-items: center; min-height: 100vh; font-family: monospace; color: #aaa; }
  h1 { margin: 1.5rem 0 0.25rem; font-size: 1.2rem; font-weight: normal; }
  .meta { font-size: 0.8rem; color: #666; margin-bottom: 0.5rem; }
  .meta a { color: #6a8; }
  .stage { width: min(95vw, 1100px); }
  #stage { display: block; width: 100%; height: min(70vh, 600px); background: #0a0e1a; border-radius: 4px; }
  .hint { font-size: 0.75rem; color: #556; margin: 0.4rem 0 1.5rem; text-align: center; }
  kbd { background: #1a2030; padding: 1px 5px; border-radius: 3px; color: #9bd; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <h1>single-hex tessellation &mdash; four strategies</h1>
  <p class="meta">generated from <a href="https://github.com/dynnamitt/hex-terrain">dynnamitt/hex-terrain</a> &mdash; <span id="sha">0fae6bc</span> &middot; <a href="index.html">back to grid preview</a></p>
  <div class="stage"><canvas id="stage"></canvas></div>
  <p class="hint">drag to orbit &middot; <kbd>w</kbd> wireframe &middot; <kbd>n</kbd> cycle subdivision levels (0&ndash;3) &middot; <kbd>h</kbd> pick another source hex</p>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { fanCentroid, threeRhombi, shapeEarcut, loopSubdivide, triCount } from './hex-tessellate.js';

const canvas = document.getElementById('stage');

const showError = (msg) => {
  canvas.insertAdjacentHTML('afterend',
    `<p style="color:#f77;text-align:center;padding:0.6rem">${msg}</p>`);
};

const labelSprite = (text) => {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.fillStyle = 'rgba(10,14,26,0.85)';
  ctx.fillRect(0, 0, c.width, c.height);
  ctx.fillStyle = '#9bd';
  ctx.font = '20px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, c.width / 2, c.height / 2);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
  sprite.scale.set(6, 1.5, 1);
  return sprite;
};

const recenter = (corners) => {
  let cx = 0, cz = 0;
  for (const [x, z] of corners) { cx += x; cz += z; }
  cx /= corners.length; cz /= corners.length;
  return corners.map(([x, z]) => [x - cx, z - cz]);
};

try {
  const res = await fetch('hex-grid.json');
  if (!res.ok) throw new Error(`hex-grid.json ${res.status}`);
  const { hexes } = await res.json();

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0e1a);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);

  const camera = new THREE.PerspectiveCamera(40, canvas.clientWidth / canvas.clientHeight, 0.1, 200);
  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const sun = new THREE.DirectionalLight(0xffffff, 1.0);
  sun.position.set(8, 20, 12);
  scene.add(sun);

  const offsets = [-15, -5, 5, 15];
  const slots = offsets.map(() => new THREE.Group());
  slots.forEach((g, i) => { g.position.x = offsets[i]; scene.add(g); });

  const meshState = { wireframe: false, subdivLevel: 0, hexIdx: 0 };

  const buildSlot = (i, name, geom) => {
    while (slots[i].children.length) slots[i].remove(slots[i].children[0]);
    const mat = new THREE.MeshStandardMaterial({
      color: 0x6c9,
      flatShading: true,
      side: THREE.DoubleSide,
      roughness: 0.85,
      metalness: 0.05,
      wireframe: meshState.wireframe,
    });
    slots[i].add(new THREE.Mesh(geom, mat));
    const wireMat = new THREE.LineBasicMaterial({ color: 0x9bd, transparent: true, opacity: 0.4 });
    const wire = new THREE.LineSegments(new THREE.WireframeGeometry(geom), wireMat);
    slots[i].add(wire);
    const label = labelSprite(`${name} — ${triCount(geom)} tris`);
    label.position.y = 4;
    slots[i].add(label);
  };

  const rebuild = () => {
    const h = hexes[meshState.hexIdx % hexes.length];
    const corners = recenter(h.corners);
    const y = 0;
    const fan = fanCentroid(corners, y);
    buildSlot(0, 'fanCentroid', fan);
    buildSlot(1, 'threeRhombi', threeRhombi(corners, y));
    buildSlot(2, 'shapeEarcut', shapeEarcut(corners, y));
    buildSlot(3, `loopSubdivide(n=${meshState.subdivLevel})`,
      meshState.subdivLevel === 0 ? fan : loopSubdivide(fan, meshState.subdivLevel));
  };

  rebuild();

  const totalSpan = (offsets[offsets.length - 1] - offsets[0]) + 12;
  camera.position.set(0, 14, totalSpan * 0.7);
  const controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;

  window.addEventListener('keydown', (e) => {
    if (e.key === 'w') {
      meshState.wireframe = !meshState.wireframe;
      rebuild();
    } else if (e.key === 'n') {
      meshState.subdivLevel = (meshState.subdivLevel + 1) % 4;
      rebuild();
    } else if (e.key === 'h') {
      meshState.hexIdx = (meshState.hexIdx + 1) % hexes.length;
      rebuild();
    }
  });

  function animate() {
    requestAnimationFrame(animate);
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    if (canvas.width !== w || canvas.height !== h) {
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    controls.update();
    renderer.render(scene, camera);
  }
  animate();
} catch (e) {
  console.error(e);
  showError(`tessellation demo failed: ${e.message}`);
}
</script>
</body>
</html>

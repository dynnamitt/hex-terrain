<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440">
  <defs>
    <style>
      text { font-family: monospace; font-size: 12px; fill: #fff; text-anchor: middle; }
      .label { font-size: 10px; fill: #bbb; }
      .vidx { font-size: 9px; fill: #999; }
      .gap-label { font-size: 11px; fill: #ffcc00; font-weight: bold; }
    </style>
    <!-- Quad gradients: blend between adjacent hex colors -->
    <linearGradient id="gRedGreen" gradientUnits="userSpaceOnUse"
        x1="267" y1="234" x2="333" y2="273">
      <stop offset="0%"   stop-color="#cc2233"/>
      <stop offset="100%" stop-color="#22aa44"/>
    </linearGradient>
    <linearGradient id="gBlueRed" gradientUnits="userSpaceOnUse"
        x1="333" y1="148" x2="267" y2="186">
      <stop offset="0%"   stop-color="#2255cc"/>
      <stop offset="100%" stop-color="#cc2233"/>
    </linearGradient>
    <linearGradient id="gGreenBlue" gradientUnits="userSpaceOnUse"
        x1="375" y1="249" x2="375" y2="172">
      <stop offset="0%"   stop-color="#22aa44"/>
      <stop offset="100%" stop-color="#2255cc"/>
    </linearGradient>
    <!-- Tri: 3 vertex-to-opposite-edge gradients layered -->
    <linearGradient id="gTriR" gradientUnits="userSpaceOnUse"
        x1="281" y1="210" x2="347" y2="210">
      <stop offset="0%"   stop-color="#cc2233" stop-opacity="1"/>
      <stop offset="100%" stop-color="#cc2233" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gTriB" gradientUnits="userSpaceOnUse"
        x1="347" y1="172" x2="314" y2="229">
      <stop offset="0%"   stop-color="#2255cc" stop-opacity="1"/>
      <stop offset="100%" stop-color="#2255cc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gTriG" gradientUnits="userSpaceOnUse"
        x1="347" y1="249" x2="314" y2="191">
      <stop offset="0%"   stop-color="#22aa44" stop-opacity="1"/>
      <stop offset="100%" stop-color="#22aa44" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="600" height="440" rx="8" fill="#050810"/>
  <title>hex-terrain gap geometry: 3 flat-top hexes with Quad + Tri gap-fillers</title>

  <!--
    Hex grid: axial coords (0,0), (1,-1), (1,0)  —  3 mutual neighbors
    Cell spacing S=100, visual hex radius R=56
    Flat-top vertex order (hexx CW in SVG): v0=Right v1=LowerRight v2=LowerLeft v3=Left v4=UpperLeft v5=UpperRight

    Centers:
      Red   A(0,0):  (225, 210)
      Blue  B(1,-1): (375, 123)
      Green C(1,0):  (375, 297)
  -->

  <!-- ============ QUAD GAP-FILLERS (even edges 0,2,4) ============ -->

  <!-- Quad: Red edge0 → Green  [A.v0, C.v4, C.v3, A.v1] -->
  <polygon points="281,210 347,249 319,297 253,259"
           fill="url(#gRedGreen)" stroke="#1a1a2a" stroke-width="3" stroke-linejoin="round"/>

  <!-- Quad: Blue edge2 → Red  [B.v2, A.v0, A.v5, B.v3] -->
  <polygon points="347,172 281,210 253,161 319,123"
           fill="url(#gBlueRed)" stroke="#1a1a2a" stroke-width="3" stroke-linejoin="round"/>

  <!-- Quad: Green edge4 → Blue  [C.v4, B.v2, B.v1, C.v5] -->
  <polygon points="347,249 347,172 403,172 403,249"
           fill="url(#gGreenBlue)" stroke="#1a1a2a" stroke-width="3" stroke-linejoin="round"/>

  <!-- ============ TRI GAP-FILLER (triple-junction vertex) ============ -->
  <!-- Tri: [A.v0, C.v4, B.v2]  — 3 layered gradients for 3-color blend -->
  <polygon points="281,210 347,249 347,172" fill="#0a0a14"/>
  <polygon points="281,210 347,249 347,172" fill="url(#gTriR)" opacity="0.7"/>
  <polygon points="281,210 347,249 347,172" fill="url(#gTriB)" opacity="0.55"/>
  <polygon points="281,210 347,249 347,172" fill="url(#gTriG)" opacity="0.45"/>
  <polygon points="281,210 347,249 347,172" fill="none" stroke="#1a1a2a" stroke-width="3" stroke-linejoin="round"/>

  <!-- ============ HEX FACES ============ -->

  <!-- RED hex A(0,0) center=(225,210) -->
  <polygon points="281,210 253,259 197,259 169,210 197,161 253,161"
           fill="#cc2233" fill-opacity="0.8" stroke="#ff4455" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- BLUE hex B(1,-1) center=(375,123) -->
  <polygon points="431,123 403,172 347,172 319,123 347,75 403,75"
           fill="#2255cc" fill-opacity="0.8" stroke="#4488ff" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- GREEN hex C(1,0) center=(375,297) -->
  <polygon points="431,297 403,346 347,346 319,297 347,249 403,249"
           fill="#22aa44" fill-opacity="0.8" stroke="#44ff88" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- ============ NEON EDGE ACCENTS (QuadEdge entities) ============ -->
  <g stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round" opacity="0.7" fill="none">
    <!-- Quad Red→Green edges -->
    <line x1="281" y1="210" x2="347" y2="249"/>
    <line x1="347" y1="249" x2="319" y2="297"/>
    <line x1="319" y1="297" x2="253" y2="259"/>
    <line x1="253" y1="259" x2="281" y2="210"/>
    <!-- Quad Blue→Red edges -->
    <line x1="347" y1="172" x2="281" y2="210"/>
    <line x1="253" y1="161" x2="319" y2="123"/>
    <!-- Quad Green→Blue edges -->
    <line x1="347" y1="249" x2="347" y2="172"/>
    <line x1="403" y1="172" x2="403" y2="249"/>
    <!-- Tri edges -->
    <line x1="281" y1="210" x2="347" y2="172"/>
    <line x1="347" y1="172" x2="347" y2="249"/>
    <line x1="347" y1="249" x2="281" y2="210"/>
  </g>

  <!-- ============ VERTEX DOTS ============ -->
  <g fill="#fff">
    <!-- Red vertices -->
    <circle cx="281" cy="210" r="3.5"/>
    <circle cx="253" cy="259" r="2.5"/>
    <circle cx="197" cy="259" r="2.5"/>
    <circle cx="169" cy="210" r="2.5"/>
    <circle cx="197" cy="161" r="2.5"/>
    <circle cx="253" cy="161" r="2.5"/>
    <!-- Blue vertices -->
    <circle cx="431" cy="123" r="2.5"/>
    <circle cx="403" cy="172" r="2.5"/>
    <circle cx="347" cy="172" r="3.5"/>
    <circle cx="319" cy="123" r="2.5"/>
    <circle cx="347" cy="75"  r="2.5"/>
    <circle cx="403" cy="75"  r="2.5"/>
    <!-- Green vertices -->
    <circle cx="431" cy="297" r="2.5"/>
    <circle cx="403" cy="346" r="2.5"/>
    <circle cx="347" cy="346" r="2.5"/>
    <circle cx="319" cy="297" r="2.5"/>
    <circle cx="347" cy="249" r="3.5"/>
    <circle cx="403" cy="249" r="2.5"/>
  </g>

  <!-- Triple-junction highlight circle -->
  <circle cx="325" cy="210" r="7" fill="none" stroke="#ffcc00" stroke-width="1.5" opacity="0.8"/>

  <!-- ============ VERTEX INDEX LABELS ============ -->
  <!-- Red A -->
  <text x="293" y="208" class="vidx">v0</text>
  <text x="248" y="273" class="vidx">v1</text>
  <text x="188" y="273" class="vidx">v2</text>
  <text x="157" y="208" class="vidx">v3</text>
  <text x="188" y="155" class="vidx">v4</text>
  <text x="248" y="155" class="vidx">v5</text>
  <!-- Blue B -->
  <text x="443" y="120" class="vidx">v0</text>
  <text x="413" y="182" class="vidx">v1</text>
  <text x="337" y="168" class="vidx">v2</text>
  <text x="307" y="120" class="vidx">v3</text>
  <text x="337" y="70"  class="vidx">v4</text>
  <text x="413" y="70"  class="vidx">v5</text>
  <!-- Green C -->
  <text x="443" y="300" class="vidx">v0</text>
  <text x="413" y="356" class="vidx">v1</text>
  <text x="337" y="356" class="vidx">v2</text>
  <text x="307" y="300" class="vidx">v3</text>
  <text x="337" y="244" class="vidx">v4</text>
  <text x="413" y="255" class="vidx">v5</text>

  <!-- ============ HEX LABELS ============ -->
  <text x="225" y="207" style="font-size:14px; fill:#ff6677; font-weight:bold;">RED</text>
  <text x="225" y="221" class="label">(0, 0)</text>

  <text x="375" y="120" style="font-size:14px; fill:#6699ff; font-weight:bold;">BLUE</text>
  <text x="375" y="134" class="label">(1, -1)</text>

  <text x="375" y="294" style="font-size:14px; fill:#55dd77; font-weight:bold;">GREEN</text>
  <text x="375" y="308" class="label">(1, 0)</text>

  <!-- ============ GAP LABELS ============ -->
  <text x="290" y="250" class="gap-label" transform="rotate(-40,290,250)">QUAD</text>
  <text x="290" y="170" class="gap-label" transform="rotate(40,290,170)">QUAD</text>
  <text x="390" y="214" class="gap-label" transform="rotate(90,390,214)">QUAD</text>
  <text x="332" y="214" class="gap-label" style="font-size:10px;">TRI</text>

  <!-- ============ LEGEND ============ -->
  <text x="300" y="400" style="font-size:13px; fill:#00e5ff;">
    hex-terrain: flat-top gap geometry (hexx 0.24)
  </text>
  <text x="300" y="416" class="label">
    Quads on even edges [0,2,4] blend 2 colors | Tri at triple-junction blends 3
  </text>
  <text x="300" y="430" class="label">
    vertex order: CW from v0=Right (hexx SVG coords)
  </text>
</svg>

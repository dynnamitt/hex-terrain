<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440">
  <defs>
    <style>
      text { font-family: monospace; font-size: 12px; fill: #fff; text-anchor: middle; }
      .label { font-size: 10px; fill: #bbb; }
      .vidx { font-size: 9px; fill: #999; }
      .gap-label { font-size: 11px; fill: #ffcc00; font-weight: bold; }
    </style>
    <!-- Quad gradients: 46% solid A | 8% blend | 46% solid B -->
    <linearGradient id="gRedGreen" gradientUnits="userSpaceOnUse"
        x1="258" y1="229" x2="342" y2="278">
      <stop offset="0%"   stop-color="#cc2233"/>
      <stop offset="46%"  stop-color="#cc2233"/>
      <stop offset="54%"  stop-color="#22aa44"/>
      <stop offset="100%" stop-color="#22aa44"/>
    </linearGradient>
    <linearGradient id="gBlueRed" gradientUnits="userSpaceOnUse"
        x1="342" y1="142" x2="258" y2="191">
      <stop offset="0%"   stop-color="#2255cc"/>
      <stop offset="46%"  stop-color="#2255cc"/>
      <stop offset="54%"  stop-color="#cc2233"/>
      <stop offset="100%" stop-color="#cc2233"/>
    </linearGradient>
    <linearGradient id="gGreenBlue" gradientUnits="userSpaceOnUse"
        x1="375" y1="259" x2="375" y2="161">
      <stop offset="0%"   stop-color="#22aa44"/>
      <stop offset="46%"  stop-color="#22aa44"/>
      <stop offset="54%"  stop-color="#2255cc"/>
      <stop offset="100%" stop-color="#2255cc"/>
    </linearGradient>
    <!-- Tri: Red base fill, Blue + Green overlay from their corners -->
    <linearGradient id="gTriB" gradientUnits="userSpaceOnUse"
        x1="353" y1="161" x2="311" y2="235">
      <stop offset="0%"   stop-color="#2255cc" stop-opacity="1"/>
      <stop offset="46%"  stop-color="#2255cc" stop-opacity="1"/>
      <stop offset="54%"  stop-color="#2255cc" stop-opacity="0"/>
      <stop offset="100%" stop-color="#2255cc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gTriG" gradientUnits="userSpaceOnUse"
        x1="353" y1="259" x2="311" y2="186">
      <stop offset="0%"   stop-color="#22aa44" stop-opacity="1"/>
      <stop offset="46%"  stop-color="#22aa44" stop-opacity="1"/>
      <stop offset="54%"  stop-color="#22aa44" stop-opacity="0"/>
      <stop offset="100%" stop-color="#22aa44" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="600" height="440" rx="8" fill="#050810"/>
  <title>hex-terrain gap geometry: 3 flat-top hexes with Quad + Tri gap-fillers</title>

  <!--
    Hex grid: axial coords (0,0), (1,-1), (1,0)  —  3 mutual neighbors
    Cell spacing S=100, visual hex radius R=44
    Flat-top vertex order (hexx CW in SVG): v0=Right v1=LowerRight v2=LowerLeft v3=Left v4=UpperLeft v5=UpperRight

    Centers:
      Red   A(0,0):  (225, 210)
      Blue  B(1,-1): (375, 123)
      Green C(1,0):  (375, 297)
  -->

  <!-- ============ QUAD GAP-FILLERS (even edges 0,2,4) ============ -->

  <!-- Quad: Red edge0 → Green  [A.v0, C.v4, C.v3, A.v1] -->
  <polygon points="269,210 353,259 331,297 247,248"
           fill="url(#gRedGreen)" stroke="#1a1a2a" stroke-width="3" stroke-linejoin="round"/>

  <!-- Quad: Blue edge2 → Red  [B.v2, A.v0, A.v5, B.v3] -->
  <polygon points="353,161 269,210 247,172 331,123"
           fill="url(#gBlueRed)" stroke="#1a1a2a" stroke-width="3" stroke-linejoin="round"/>

  <!-- Quad: Green edge4 → Blue  [C.v4, B.v2, B.v1, C.v5] -->
  <polygon points="353,259 353,161 397,161 397,259"
           fill="url(#gGreenBlue)" stroke="#1a1a2a" stroke-width="3" stroke-linejoin="round"/>

  <!-- ============ TRI GAP-FILLER (triple-junction vertex) ============ -->
  <!-- Tri: [A.v0, C.v4, B.v2]  — Red base, Blue+Green overlay from corners -->
  <polygon points="269,210 353,259 353,161" fill="#cc2233"/>
  <polygon points="269,210 353,259 353,161" fill="url(#gTriB)" opacity="0.9"/>
  <polygon points="269,210 353,259 353,161" fill="url(#gTriG)" opacity="0.9"/>
  <polygon points="269,210 353,259 353,161" fill="none" stroke="#1a1a2a" stroke-width="3" stroke-linejoin="round"/>

  <!-- ============ HEX FACES ============ -->

  <!-- RED hex A(0,0) center=(225,210) R=44 -->
  <polygon points="269,210 247,248 203,248 181,210 203,172 247,172"
           fill="#cc2233" fill-opacity="0.8" stroke="#ff4455" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- BLUE hex B(1,-1) center=(375,123) R=44 -->
  <polygon points="419,123 397,161 353,161 331,123 353,85 397,85"
           fill="#2255cc" fill-opacity="0.8" stroke="#4488ff" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- GREEN hex C(1,0) center=(375,297) R=44 -->
  <polygon points="419,297 397,335 353,335 331,297 353,259 397,259"
           fill="#22aa44" fill-opacity="0.8" stroke="#44ff88" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- ============ NEON EDGE ACCENTS (QuadEdge entities) ============ -->
  <g stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round" opacity="0.7" fill="none">
    <!-- Quad Red→Green edges -->
    <line x1="269" y1="210" x2="353" y2="259"/>
    <line x1="353" y1="259" x2="331" y2="297"/>
    <line x1="331" y1="297" x2="247" y2="248"/>
    <line x1="247" y1="248" x2="269" y2="210"/>
    <!-- Quad Blue→Red edges -->
    <line x1="353" y1="161" x2="269" y2="210"/>
    <line x1="247" y1="172" x2="331" y2="123"/>
    <!-- Quad Green→Blue edges -->
    <line x1="353" y1="259" x2="353" y2="161"/>
    <line x1="397" y1="161" x2="397" y2="259"/>
    <!-- Tri edges -->
    <line x1="269" y1="210" x2="353" y2="161"/>
    <line x1="353" y1="161" x2="353" y2="259"/>
    <line x1="353" y1="259" x2="269" y2="210"/>
  </g>

  <!-- ============ VERTEX DOTS ============ -->
  <g fill="#fff">
    <!-- Red vertices -->
    <circle cx="269" cy="210" r="3.5"/>
    <circle cx="247" cy="248" r="2.5"/>
    <circle cx="203" cy="248" r="2.5"/>
    <circle cx="181" cy="210" r="2.5"/>
    <circle cx="203" cy="172" r="2.5"/>
    <circle cx="247" cy="172" r="2.5"/>
    <!-- Blue vertices -->
    <circle cx="419" cy="123" r="2.5"/>
    <circle cx="397" cy="161" r="2.5"/>
    <circle cx="353" cy="161" r="3.5"/>
    <circle cx="331" cy="123" r="2.5"/>
    <circle cx="353" cy="85"  r="2.5"/>
    <circle cx="397" cy="85"  r="2.5"/>
    <!-- Green vertices -->
    <circle cx="419" cy="297" r="2.5"/>
    <circle cx="397" cy="335" r="2.5"/>
    <circle cx="353" cy="335" r="2.5"/>
    <circle cx="331" cy="297" r="2.5"/>
    <circle cx="353" cy="259" r="3.5"/>
    <circle cx="397" cy="259" r="2.5"/>
  </g>

  <!-- ============ LABELS (outside geometry only) ============ -->
  <!-- Red A - vertex indices outside hex -->
  <text x="280" y="205" class="vidx">v0</text>
  <text x="238" y="264" class="vidx">v1</text>
  <text x="192" y="264" class="vidx">v2</text>
  <text x="168" y="208" class="vidx">v3</text>
  <text x="192" y="166" class="vidx">v4</text>
  <text x="238" y="166" class="vidx">v5</text>
  <!-- Blue B - vertex indices outside hex -->
  <text x="432" y="118" class="vidx">v0</text>
  <text x="409" y="170" class="vidx">v1</text>
  <text x="341" y="170" class="vidx">v2</text>
  <text x="318" y="118" class="vidx">v3</text>
  <text x="341" y="80"  class="vidx">v4</text>
  <text x="409" y="80"  class="vidx">v5</text>
  <!-- Green C - vertex indices outside hex -->
  <text x="432" y="302" class="vidx">v0</text>
  <text x="409" y="348" class="vidx">v1</text>
  <text x="341" y="348" class="vidx">v2</text>
  <text x="318" y="302" class="vidx">v3</text>
  <text x="341" y="254" class="vidx">v4</text>
  <text x="409" y="268" class="vidx">v5</text>
  <!-- Hex names outside geometry -->
  <text x="168" y="214" style="font-size:13px; fill:#ff6677; font-weight:bold;" text-anchor="end">RED (0,0)</text>
  <text x="455" y="100" style="font-size:13px; fill:#6699ff; font-weight:bold;" text-anchor="start">BLUE (1,-1)</text>
  <text x="455" y="320" style="font-size:13px; fill:#55dd77; font-weight:bold;" text-anchor="start">GREEN (1,0)</text>
  <!-- Gap type callouts outside geometry -->
  <text x="210" y="290" class="gap-label" text-anchor="end">QUAD</text>
  <text x="210" y="147" class="gap-label" text-anchor="end">QUAD</text>
  <text x="435" y="214" class="gap-label" text-anchor="start">QUAD</text>

  <!-- ============ LEGEND ============ -->
  <text x="300" y="400" style="font-size:13px; fill:#00e5ff;">
    hex-terrain: flat-top gap geometry (hexx 0.24)
  </text>
  <text x="300" y="416" class="label">
    Quads on even edges [0,2,4] blend 2 colors | Tri at triple-junction blends 3
  </text>
  <text x="300" y="430" class="label">
    vertex order: CW from v0=Right (hexx SVG coords)
  </text>
</svg>

name: Hex Grid SVG

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  svg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: Swatinem/rust-cache@v2

      - name: Generate SVG
        run: cargo run -p hex-grid --example svg --release > hex-grid.svg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hex-grid-svg
          path: hex-grid.svg

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" hex-grid.svg --clobber

name: SVG Preview

on:
  push:
    paths:
      - "crates/hex-grid/**"
      - "web/svg-preview.html"
      - "web/hex-terrain.html"
      - "web/hex-terrain.js"
      - ".github/workflows/svg-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: svg-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Build preview
        run: make svg-preview SHORT_SHA="${GITHUB_SHA::7}" SVG_OUT=deploy

      - name: Deploy to gh-pages/svg
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1

      - name: Publish
        run: |
          rm -rf gh-pages/svg
          cp -r deploy gh-pages/svg
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add svg/
          git diff --cached --quiet && exit 0
          git commit -m "svg preview ${GITHUB_SHA::7}"
          git push
